# 条件B2：LDA+MLLT の段階を外した構成に、f0（pitch）と有声性（voicing）を加える。
# 手がかりが LDA+MLLT で他の次元と混ぜられないため、D12 の否定的結果が
# 「素性水準の説明が誤り」なのか「手がかりが薄まっただけ」なのかを分けられる。
# 条件A2との違いは use_pitch / use_voicing の2行だけ（docs/decisions-log.md D14）。
features:
  type: mfcc
  use_energy: false
  frame_shift: 10
  frame_length: 25
  dither: 1
  use_pitch: true
  use_voicing: true
training:
  - monophone:
      subset: 10000
      boost_silence: 1.25
  - triphone:
      subset: 20000
      boost_silence: 1.25
      num_leaves: 2000
      max_gaussians: 10000
  - sat:
      subset: 20000
      num_leaves: 2500
      max_gaussians: 15000
  - sat:
      subset: 50000
      num_leaves: 4200
      max_gaussians: 40000
  - pronunciation_probabilities:
      subset: 50000
  - sat:
      subset: 150000
      num_leaves: 5000
      max_gaussians: 100000
  - pronunciation_probabilities:
      subset: 150000
      optional: true
  - sat:
      subset: 0
      num_leaves: 7000
      optional: true
      max_gaussians: 150000
      num_iterations: 20
      quick: true
